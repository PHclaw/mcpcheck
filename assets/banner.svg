<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="mcpcheck">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1B2436" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.5"/>
  <circle cx="1080" cy="40" r="260" fill="url(#glow)"/>

  <rect x="72" y="70" width="6" height="80" rx="3" fill="url(#accent)"/>

  <text x="98" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#E6EDF3">mcpcheck</text>
  <text x="100" y="172" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" fill="#8B949E">Audit an MCP server the way an agent experiences it.</text>

  <g>
      <rect x="72" y="236" width="66" height="30" rx="15" fill="#151C2C" stroke="#243044"/>
      <text x="105" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B949E">audit</text>
    </g>
    <g>
      <rect x="148" y="236" width="58" height="30" rx="15" fill="#151C2C" stroke="#243044"/>
      <text x="177" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B949E">diff</text>
    </g>
    <g>
      <rect x="216" y="236" width="66" height="30" rx="15" fill="#151C2C" stroke="#243044"/>
      <text x="249" y="256" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8B949E">proxy</text>
    </g>

  <rect x="700" y="62" width="508" height="196" rx="14" fill="#0D1117" stroke="#253046"/>
  <circle cx="726" cy="88" r="5" fill="#F85149"/>
  <circle cx="746" cy="88" r="5" fill="#D29922"/>
  <circle cx="766" cy="88" r="5" fill="#3FB950"/>
  <line x1="700" y1="106" x2="1208" y2="106" stroke="#253046"/>
  <text x="742" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#E6EDF3" xml:space="preserve">$ mcpcheck -- node server.js</text>
      <text x="742" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#8B949E" xml:space="preserve">tools/list</text>
      <text x="1030" y="152" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#C9D1D9">14 tools</text>
      <text x="1166" y="152" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#6E7681">3,141 tok</text>
      <text x="742" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#D29922" xml:space="preserve">ISSUES</text>
      <text x="1030" y="182" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#C9D1D9">9 warnings</text>
      <text x="742" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#F85149" xml:space="preserve">verdict</text>
      <text x="1030" y="212" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#C9D1D9">2 errors</text>
  <text x="742" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#4B5563">context cost, measured</text>
</svg>
